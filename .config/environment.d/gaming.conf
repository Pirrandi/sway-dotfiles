# Habilita VRR/G-Sync para apps OpenGL (Vulkan lo negocia solo)
__GL_GSYNC_ALLOWED=1
__GL_VRR_ALLOWED=1

# Cachea shaders compilados por juego en disco -> menos stutter de compilación
# en la segunda corrida de un juego (afecta sobre todo OpenGL/algunos Vulkan)
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# Si en algún juego ves el cursor romperse/parpadear en HDMI-A-1, descomentar:
# WLR_NO_HARDWARE_CURSORS=1
