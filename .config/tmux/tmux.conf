# ============================================
# CONFIGURACIÓN BÁSICA
# ============================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -s set-clipboard on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ',xterm-256color:clipboard'
set -g default-shell /usr/bin/zsh

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0
set -g mouse on

bind q kill-pane
bind Q kill-window

# ============================================
# ATAJOS DE TECLADO
# ============================================
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuración recargada!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

# Selector de sesiones
bind S choose-tree -s

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# F12 desactiva este tmux para controlar uno anidado (por ejemplo, en SSH).
# Pulsar F12 de nuevo lo reactiva.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "bg=#0c0c0c,fg=#525253" \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  run-shell "~/.config/tmux/ssh-status.sh \"#{session_name}\"" \; \
  refresh-client -S

# ============================================
# SSH
# ============================================
# Variables que se actualizan al adjuntar un cliente
set -g update-environment "SSH_CONNECTION SSH_CLIENT SSH_TTY DISPLAY WAYLAND_DISPLAY SSH_AUTH_SOCK"

# La barra se pinta de rojo cuando la sesión llega por SSH
set-hook -g client-attached 'run-shell "~/.config/tmux/ssh-status.sh \"#{session_name}\""'
set-hook -g session-window-changed 'set-option -wu @claude_done'
set-hook -g session-created 'run-shell "~/.config/tmux/ssh-status.sh \"#{session_name}\""'

# ============================================
# TEMA — carbonfox (nightfox.nvim)
# ============================================
# Barra de estado
set -g status-style bg=#0c0c0c,fg=#b6b8bb
set -g status-interval 60
set -g status-justify centre

# Ventanas (󰊓 indica un panel con zoom)
# @claude_done: set by claude-ws-mark.sh when Claude finishes in a background window
setw -g window-status-format "#{?@claude_done,#[bg=#d97757#,fg=#161616#,bold],} #I:#W#{?window_zoomed_flag, 󰊓,}#{?@claude_done, ✻,} "
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-style bg=#0c0c0c,fg=#6e6f70
setw -g window-status-current-style bg=#78a9ff,fg=#161616,bold

# Panel izquierdo — sesión e indicador de prefijo / modo anidado
set -g status-left-length 40
set -g status-left "#[fg=#f2f4f8,bg=#2a2a2a]  #S #[default]#{?#{==:#{client_key_table},off},#[fg=#7b7c7e#,bg=#3c3c3c#,bold] OFF #[default],#{?client_prefix,#[fg=#161616#,bg=#ff7eb6#,bold] PREFIX #[default],}} "

# Panel derecho — host y hora
set -g status-right-length 60
set -g status-right "#[fg=#7b7c7e] 󰒋 #h #[fg=#b6b8bb,bold] 󰥔 %H:%M "

# Bordes de panes
set -g pane-border-style fg=#2a2a2a
set -g pane-active-border-style fg=#78a9ff

# Mensajes
set -g message-style bg=#2a2a2a,fg=#f2f4f8,bold

# Modo copia / selección
setw -g mode-style bg=#525253,fg=#f2f4f8

# Actividad
setw -g monitor-activity on
set -g visual-activity off


