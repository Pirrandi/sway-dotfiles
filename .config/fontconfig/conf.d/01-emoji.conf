<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Noto Color Emoji advertises coverage of the ASCII digits, '#' and '*',
       because those are the base characters of the keycap sequences (1|+FE0F+20E3
       renders as the emoji 1). That is legitimate for the font, but it means the
       family is a candidate for every plain digit in the UI.

       Combined with the append below it used to be fatal: with binding="strong"
       the appended family outranked the real text families, so `fc-match
       sans-serif` and `fc-match monospace` both resolved to Noto Color Emoji and
       every digit in GTK apps and browsers was drawn from the emoji font.

       Two independent guards, because either one alone is fragile:
         1. scan-time: drop those codepoints from the font's charset, so it can
            never be selected for a bare digit no matter how it is ranked.
         2. pattern-time: append weakly, so emoji stay a fallback behind whatever
            family the application actually asked for.
       U+20E3 is deliberately kept so real keycap sequences still compose. -->

  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <int>0x0023</int>
          <int>0x002a</int>
          <range>
            <int>0x0030</int>
            <int>0x0039</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>

</fontconfig>
