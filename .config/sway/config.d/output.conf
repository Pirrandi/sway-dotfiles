# Fondo


# Posiciones — interno a la izquierda, HDMI a la derecha
# NOTA: en swayfx 0.5.3 el `reload` no aplica bien el `position` de estas
# líneas (bug del compositor, verificado). Por eso se fuerza con exec_always,
# que sí lo aplica de forma confiable via IPC.
# eDP-1 tiene scale 1.1 -> ancho lógico 1920/1.1 ≈ 1745, de ahí el offset.
output HDMI-A-2 resolution 1920x1080
output eDP-1 resolution 1920x1080 scale 1.1
exec_always swaymsg 'output eDP-1 position 0 0; output HDMI-A-2 position 1745 0'

# Workspaces
workspace 10 output HDMI-A-2
workspace 1 output eDP-1
workspace 2 output eDP-1
workspace 3 output eDP-1
workspace 4 output eDP-1
workspace 5 output eDP-1
workspace 6 output eDP-1
workspace 7 output eDP-1
workspace 8 output eDP-1
workspace 9 output eDP-1
