# Fondo
# Gestionado por sway (un único swaybg, reaplicado en cada reload). No agregues
# un `exec swaybg` en autostart.conf: quedan dos procesos dibujando a la vez.
output * bg /home/pirra/Pictures/wallpaper.png fill

# Posiciones — HDMI a la izquierda, interno a la derecha
# (era HDMI-A-2 en el config viejo, pero el monitor real conectado es HDMI-A-1 —
# esa línea nunca estaba aplicando)
output HDMI-A-1 resolution 1920x1080 position 0,0 adaptive_sync on
output eDP-1 resolution 1920x1080 position 1920,0 scale 1.1

# Workspaces
# Los nombres tienen que coincidir EXACTO con lo que genera ws.sh:
# "${CTX}:$(printf %02d N)" → personal:01, work:01... Antes acá decía
# `workspace 1 output eDP-1`, un nombre que ws.sh nunca produce, así que las
# 10 asignaciones estaban muertas y sway elegía el monitor por su cuenta.
# Si un output no existe (ej. eDP-1 en la torre), sway ignora la asignación y
# manda el workspace al monitor disponible — por eso esto es portable.
workspace personal:01 output eDP-1
workspace personal:02 output eDP-1
workspace personal:03 output eDP-1
workspace personal:04 output eDP-1
workspace personal:05 output eDP-1
workspace personal:06 output eDP-1
workspace personal:07 output eDP-1
workspace personal:08 output eDP-1
workspace personal:09 output eDP-1
workspace personal:10 output HDMI-A-1

workspace work:01 output eDP-1
workspace work:02 output eDP-1
workspace work:03 output eDP-1
workspace work:04 output eDP-1
workspace work:05 output eDP-1
workspace work:06 output eDP-1
workspace work:07 output eDP-1
workspace work:08 output eDP-1
workspace work:09 output eDP-1
workspace work:10 output HDMI-A-1
