# ~/.config/alacritty/alacritty.toml

[window]
padding.x = 10
padding.y = 10
opacity = 0.95
blur = false
decorations = "full"
dynamic_title = true

[terminal.shell]
# Se adjunta a la sesión "main" de tmux (ver ~/.config/tmux/attach.sh)
program = "/bin/sh"
args = ["-c", "exec \"$HOME/.config/tmux/attach.sh\""]

[scrolling]
history = 10000

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# Paleta carbonfox (nightfox.nvim, igual que el colorscheme de Neovim)
[colors.primary]
background        = "#161616"
foreground        = "#f2f4f8"
dim_foreground    = "#b6b8bb"
bright_foreground = "#f9fbff"

[colors.cursor]
text   = "#f2f4f8"
cursor = "#b6b8bb"

[colors.vi_mode_cursor]
text   = "#161616"
cursor = "#33b1ff"

[colors.selection]
background = "#2a2a2a"
text       = "#f2f4f8"

[colors.search.matches]
background = "#525253"
foreground = "#f2f4f8"

[colors.search.focused_match]
background = "#3ddbd9"
foreground = "#161616"

[colors.footer_bar]
background = "#353535"
foreground = "#f2f4f8"

[colors.normal]
black   = "#282828"
red     = "#ee5396"
green   = "#25be6a"
yellow  = "#08bdba"
blue    = "#78a9ff"
magenta = "#be95ff"
cyan    = "#33b1ff"
white   = "#dfdfe0"

[colors.bright]
black   = "#484848"
red     = "#f16da6"
green   = "#46c880"
yellow  = "#2dc7c4"
blue    = "#8cb6ff"
magenta = "#c8a5ff"
cyan    = "#52bdff"
white   = "#e4e4e5"

[colors.dim]
black   = "#222222"
red     = "#ca4780"
green   = "#1fa25a"
yellow  = "#07a19e"
blue    = "#6690d9"
magenta = "#a27fd9"
cyan    = "#2b96d9"
white   = "#bebebe"

[[colors.indexed_colors]]
index = 16
color = "#3ddbd9"

[[colors.indexed_colors]]
index = 17
color = "#ff7eb6"

[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 500
thickness = 0.1
unfocused_hollow = false

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"
